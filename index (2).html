<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1chai65 Music">
<title>1chai65 - Chill Music Player</title>
<style>
  :root {
    --pink: #ff2a85;
    --cyan: #00f0ff;
    --bg: #090910;
    --panel: rgba(20, 20, 32, 0.78);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f4f4f8;
    --muted: #8b8ba7;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a102b 0%, #090910 55%, #050509 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px 16px 46px;
    overflow-x: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 960px;
    background: var(--panel);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65), 0 0 40px rgba(255, 42, 133, 0.08);
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    overflow: hidden;
    position: relative;
  }

  /* LEFT PANEL */
  .left-panel {
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    border-right: 1px solid var(--border);
    position: relative;
  }

  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .brand-box {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    padding: 4px 8px 4px 4px;
    border-radius: 999px;
    transition: background 0.2s;
  }

  .brand-box:hover {
    background: rgba(255, 255, 255, 0.06);
  }

  .channel-logo {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--pink);
    box-shadow: 0 0 12px rgba(255, 42, 133, 0.5);
    background: #151522;
  }

  .brand-name {
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #fff, #ff7eb3);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .action-btns {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }

  .mini-btn {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 9px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s ease;
  }

  .mini-btn:hover {
    background: rgba(255, 42, 133, 0.2);
    border-color: var(--pink);
    color: #fff;
  }

  .mini-btn.install-btn {
    background: linear-gradient(135deg, var(--pink), #b81d65);
    border-color: transparent;
    color: #fff;
    display: none;
  }

  .mini-btn.danger:hover {
    background: rgba(255, 65, 65, 0.25);
    border-color: #ff4d4d;
  }

  /* VINYL + CIRCULAR WAVE */
  .stage {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 12px 0;
  }

  #waveCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .vinyl-disc {
    width: 174px;
    height: 174px;
    border-radius: 50%;
    background:
      radial-gradient(circle at center, #111 0%, #111 32%, transparent 33%),
      repeating-radial-gradient(circle at center, #14141c 0px, #14141c 3px, #1e1e2a 4px, #14141c 5px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 18px rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: spinVinyl 14s linear infinite;
    animation-play-state: paused;
    transition: transform 0.15s ease-out;
  }

  .vinyl-disc.playing {
    animation-play-state: running;
  }

  @keyframes spinVinyl {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .vinyl-center {
    width: 86px;
    height: 86px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #232334, #0c0c12 75%);
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .vinyl-cover-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .vinyl-cover-img.visible {
    display: block;
  }

  .vinyl-spindle {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #090910;
    border: 2px solid rgba(255, 255, 255, 0.25);
    z-index: 2;
    box-shadow: 0 0 6px rgba(0,0,0,0.8);
  }

  /* TRACK TITLE & COLOR DOTS */
  .track-meta {
    width: 100%;
    text-align: center;
    margin-bottom: 10px;
  }

  .song-title {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 12px;
    text-shadow: 0 0 14px rgba(255, 42, 133, 0.35);
  }

  .color-dots {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .dot-btn {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.25);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }

  .dot-btn:hover {
    transform: scale(1.25);
  }

  .dot-btn.active {
    transform: scale(1.3);
    border-color: #fff;
  }

  .dot-pink { background: #ff2a85; box-shadow: 0 0 8px #ff2a85; }
  .dot-cyan { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
  .dot-rainbow {
    background: conic-gradient(#ff2a85, #ffbe0b, #00f5d4, #00bbf9, #9b5de5, #ff2a85);
    box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
  }
  .dot-white { background: #ffffff; box-shadow: 0 0 8px #ffffff; }

  /* PROGRESS BAR */
  .progress-wrap {
    width: 100%;
    margin: 6px 0 14px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--cyan));
    border-radius: 999px;
    transition: width 0.1s linear;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  /* PLAYER CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .ctrl-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .ctrl-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-1px);
  }

  .ctrl-btn.active {
    color: var(--pink);
    border-color: var(--pink);
    box-shadow: 0 0 12px rgba(255, 42, 133, 0.4);
  }

  .repeat-badge {
    position: absolute;
    top: -3px;
    right: -3px;
    background: var(--pink);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .ctrl-btn.repeat-one .repeat-badge {
    display: flex;
  }

  .play-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--pink), #ff5e9c);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255, 42, 133, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .play-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 28px rgba(255, 42, 133, 0.7);
  }

  /* RIGHT PANEL - PLAYLIST */
  .right-panel {
    padding: 20px 22px 18px;
    display: flex;
    flex-direction: column;
    height: 480px;
  }

  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .playlist-title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #fff;
  }

  .playlist-status {
    font-size: 11px;
    color: var(--cyan);
    background: rgba(0, 240, 255, 0.1);
    padding: 3px 9px;
    border-radius: 999px;
  }

  .playlist-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .playlist-list::-webkit-scrollbar {
    width: 5px;
  }

  .playlist-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.16);
    border-radius: 999px;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    gap: 10px;
    padding: 20px;
    border: 1px dashed rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .empty-state:hover {
    border-color: var(--pink);
    background: rgba(255, 42, 133, 0.05);
  }

  .song-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    gap: 10px;
  }

  .song-item:hover {
    background: rgba(255, 255, 255, 0.08);
  }

  .song-item.active {
    background: linear-gradient(90deg, rgba(255, 42, 133, 0.2), rgba(0, 240, 255, 0.08));
    border-color: rgba(255, 42, 133, 0.45);
  }

  .song-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }

  .song-idx {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  .song-item.active .song-idx {
    color: var(--pink);
  }

  .song-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .song-dur {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .del-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 13px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }

  .del-btn:hover {
    background: rgba(255, 65, 65, 0.25);
    color: #ff6b6b;
  }

  /* SOCIAL FOOTER IN RIGHT PANEL */
  .social-bar {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .soc-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
    transition: all 0.2s;
  }

  .soc-btn:hover {
    transform: translateY(-1px);
    border-color: var(--pink);
    background: rgba(255, 42, 133, 0.22);
  }

  .soc-fb:hover { border-color: #1877f2; background: rgba(24, 119, 242, 0.25); }
  .soc-tt:hover { border-color: #00f0ff; background: rgba(0, 240, 255, 0.2); }
  .soc-zl:hover { border-color: #0068ff; background: rgba(0, 104, 255, 0.25); }

  /* BOTTOM MARQUEE */
  .marquee-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 32px;
    background: rgba(8, 8, 15, 0.92);
    border-top: 1px solid rgba(255, 42, 133, 0.25);
    display: flex;
    align-items: center;
    overflow: hidden;
    z-index: 50;
  }

  .marquee-track {
    display: inline-block;
    white-space: nowrap;
    padding-left: 100%;
    animation: marqueeScroll 22s linear infinite;
    font-size: 12px;
    font-weight: 600;
    color: #f0f0ff;
    letter-spacing: 0.4px;
  }

  @keyframes marqueeScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 44px;
    right: 18px;
    background: rgba(20, 20, 34, 0.95);
    border: 1px solid var(--pink);
    color: #fff;
    padding: 9px 15px;
    border-radius: 12px;
    font-size: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 780px) {
    .app-shell {
      grid-template-columns: 1fr;
    }
    .left-panel {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .right-panel {
      height: 360px;
    }
  }
</style>
</head>
<body>

<div class="app-shell">
  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="top-bar">
      <div class="brand-box" id="logoTrigger" title="Bấm để đổi ảnh đại diện kênh">
        <img src="logo.jpg" alt="1chai65" class="channel-logo" id="channelLogo" onerror="this.style.display='none'">
        <span class="brand-name">1chai65</span>
      </div>

      <div class="action-btns">
        <button class="mini-btn install-btn" id="installAppBtn">📲 Cài App</button>
        <button class="mini-btn" id="addMusicBtn">+ Thêm nhạc</button>
        <button class="mini-btn" id="saveListBtn">💾 Lưu danh sách</button>
        <button class="mini-btn danger" id="clearAllBtn" style="display:none;">🗑 Xóa hết</button>
      </div>
    </div>

    <!-- VINYL & CIRCULAR WAVE -->
    <div class="stage">
      <canvas id="waveCanvas" width="520" height="520"></canvas>
      <div class="vinyl-disc" id="vinylDisc">
        <div class="vinyl-center">
          <img id="vinylCoverImg" class="vinyl-cover-img" alt="Cover">
          <div class="vinyl-spindle"></div>
        </div>
      </div>
    </div>

    <!-- TRACK TITLE + COLOR DOTS -->
    <div class="track-meta">
      <div class="song-title" id="songTitle">Chưa có bài hát nào</div>
      <div class="color-dots" id="colorDots">
        <button class="dot-btn dot-pink active" data-theme="pink" title="Hồng Neon"></button>
        <button class="dot-btn dot-cyan" data-theme="cyan" title="Xanh Cyan"></button>
        <button class="dot-btn dot-rainbow" data-theme="rainbow" title="Cầu vồng"></button>
        <button class="dot-btn dot-white" data-theme="white" title="Trắng sáng"></button>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="currentTime">00:00</span>
        <span id="totalTime">00:00</span>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="ctrl-btn" id="shuffleBtn" title="Phát ngẫu nhiên">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      </button>

      <button class="ctrl-btn" id="prevBtn" title="Bài trước">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.4"/></svg>
      </button>

      <button class="play-btn" id="playBtn" title="Phát / Tạm dừng">
        <svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" title="Bài tiếp theo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.4"/></svg>
      </button>

      <button class="ctrl-btn" id="repeatBtn" title="Lặp lại">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="repeat-badge">1</span>
      </button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="playlist-header">
      <span class="playlist-title">Danh sách phát (<span id="songCount">0</span>)</span>
      <span class="playlist-status" id="modeStatus">Tuần tự</span>
    </div>

    <div class="playlist-list" id="playlistContainer">
      <div class="empty-state" id="emptyState">
        <div style="font-size:28px;">🎵</div>
        <div style="font-size:13px;font-weight:600;color:#fff;">Danh sách đang trống</div>
        <div style="font-size:11px;">Bấm <b>+ Thêm nhạc</b> để chọn các tệp MP3 từ thiết bị</div>
      </div>
    </div>

    <div class="social-bar">
      <button class="soc-btn" id="shareBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Chia sẻ
      </button>
      <a class="soc-btn soc-fb" href="https://web.facebook.com/qtksnb" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        Facebook
      </a>
      <a class="soc-btn soc-tt" href="https://www.tiktok.com/@1chai65" target="_blank" rel="noopener">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>

  // --- EXTRACT EMBEDDED MP3 COVER ART (ID3v2 APIC) ---
  async function extractCoverFromFile(file) {
    try {
      const sliceSize = Math.min(file.size, 1024 * 1024 * 2); // first 2MB
      const buf = await file.slice(0, sliceSize).arrayBuffer();
      const bytes = new Uint8Array(buf);
      if (bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return null; // "ID3"

      const version = bytes[3];
      const tagSize = ((bytes[6] & 0x7f) << 21) | ((bytes[7] & 0x7f) << 14) | ((bytes[8] & 0x7f) << 7) | (bytes[9] & 0x7f);
      let pos = 10;
      const limit = Math.min(bytes.length, tagSize + 10);

      while (pos + 10 < limit) {
        const frameId = String.fromCharCode(bytes[pos], bytes[pos+1], bytes[pos+2], bytes[pos+3]);
        if (!/^[A-Z0-9]{4}$/.test(frameId)) break;

        let frameSize = 0;
        if (version === 4) {
          frameSize = ((bytes[pos+4] & 0x7f) << 21) | ((bytes[pos+5] & 0x7f) << 14) | ((bytes[pos+6] & 0x7f) << 7) | (bytes[pos+7] & 0x7f);
        } else {
          frameSize = (bytes[pos+4] << 24) | (bytes[pos+5] << 16) | (bytes[pos+6] << 8) | bytes[pos+7];
        }
        if (frameSize <= 0 || pos + 10 + frameSize > limit) break;

        if (frameId === 'APIC') {
          let p = pos + 10;
          const end = p + frameSize;
          const encoding = bytes[p++];
          let mime = '';
          while (p < end && bytes[p] !== 0) {
            mime += String.fromCharCode(bytes[p++]);
          }
          p++; // skip null
          p++; // skip picture type
          if (encoding === 0 || encoding === 3) {
            while (p < end && bytes[p] !== 0) p++;
            p++;
          } else {
            while (p + 1 < end && !(bytes[p] === 0 && bytes[p+1] === 0)) p += 2;
            p += 2;
          }
          if (p < end) {
            const imgBytes = bytes.slice(p, end);
            const blob = new Blob([imgBytes], { type: mime || 'image/jpeg' });
            return await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => resolve(null);
              reader.readAsDataURL(blob);
            });
          }
        }
        pos += 10 + frameSize;
      }
    } catch (e) {}
    return null;
  }

  // --- UPDATE VINYL CENTER (ONLY SONG COVER ART) ---
  function updateVinylCover(coverDataUrl) {
    if (coverDataUrl) {
      vinylCoverImg.src = coverDataUrl;
      vinylCoverImg.classList.add('visible');
    } else {
      vinylCoverImg.removeAttribute('src');
      vinylCoverImg.classList.remove('visible');
    }
  }

  // --- INDEXEDDB STORAGE ---
  const DB_NAME = '1chai65_MusicDB_v4';
  const STORE_NAME = 'playlistStore';

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveToDB() {
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const serializedSongs = songs.map(s => ({
        title: s.title,
        duration: s.duration,
        cover: s.cover || null,
        blob: s.blob || null
      }));
      store.put(serializedSongs, 'savedSongs');
      if (customLogoDataUrl) store.put(customLogoDataUrl, 'customLogo');
      showToast('Đã lưu danh sách nhạc vào ứng dụng!');
    } catch (err) {
      showToast('Không thể lưu dữ liệu trên trình duyệt này');
    }
  }

  async function loadFromDB() {
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const savedSongs = await new Promise(res => {
        const r = store.get('savedSongs');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
      const savedLogo = await new Promise(res => {
        const r = store.get('customLogo');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      });
      if (savedLogo) {
        customLogoDataUrl = savedLogo;
        channelLogo.src = savedLogo;
        channelLogo.style.display = 'block';
      }
      if (Array.isArray(savedSongs) && savedSongs.length > 0) {
        songs = savedSongs.filter(s => s.blob).map(s => ({
          title: s.title,
          duration: s.duration || '--:--',
          cover: s.cover || null,
          blob: s.blob,
          src: URL.createObjectURL(s.blob)
        }));
        renderPlaylist();
        if (songs.length > 0) {
          loadSong(0, false);
        }
      }
    } catch (e) {}
  }

  async function clearDB() {
    try {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).delete('savedSongs');
    } catch (e) {}
  }

  // --- PLAYLIST RENDER & ACTIONS ---
  function renderPlaylist() {
    songCountEl.textContent = songs.length;
    clearAllBtn.style.display = songs.length > 0 ? 'inline-flex' : 'none';

    if (songs.length === 0) {
      playlistContainer.innerHTML = `
        <div class="empty-state" id="emptyState">
          <div style="font-size:28px;">🎵</div>
          <div style="font-size:13px;font-weight:600;color:#fff;">Danh sách đang trống</div>
          <div style="font-size:11px;">Bấm <b>+ Thêm nhạc</b> để chọn các tệp MP3 từ thiết bị</div>
        </div>
      `;
      document.getElementById('emptyState').addEventListener('click', () => musicInput.click());
      return;
    }

    playlistContainer.innerHTML = '';
    songs.forEach((song, idx) => {
      const item = document.createElement('div');
      item.className = 'song-item' + (idx === currentIndex ? ' active' : '');
      item.innerHTML = `
        <div class="song-left">
          <span class="song-idx">${String(idx + 1).padStart(2, '0')}</span>
          <span class="song-name">${escapeHtml(song.title)}</span>
        </div>
        <div class="song-right">
          <span class="song-dur">${song.duration}</span>
          <button class="del-btn" title="Xóa bài này">✕</button>
        </div>
      `;

      item.addEventListener('click', (e) => {
        if (e.target.closest('.del-btn')) return;
        loadSong(idx, true);
      });

      item.querySelector('.del-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSong(idx);
      });

      playlistContainer.appendChild(item);
    });

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function loadSong(index, autoPlay = true) {
    if (index < 0 || index >= songs.length) return;
    currentIndex = index;
    const song = songs[index];
    audio.src = song.src;
    songTitleEl.textContent = song.title;
    updateVinylCover(song.cover);
    progressFill.style.width = '0%';
    currentTimeEl.textContent = '00:00';
    totalTimeEl.textContent = song.duration !== '--:--' ? song.duration : '00:00';
    renderPlaylist();

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title,
        artist: '1chai65',
        artwork: song.cover ? [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }] : []
      });
    }

    if (autoPlay) {
      playAudio();
    } else {
      pauseAudio();
    }
  }

  function deleteSong(idx) {
    const removed = songs[idx];
    if (removed && removed.src) URL.revokeObjectURL(removed.src);
    songs.splice(idx, 1);

    if (songs.length === 0) {
      audio.pause();
      audio.removeAttribute('src');
      isPlaying = false;
      currentIndex = -1;
      vinylDisc.classList.remove('playing');
      updatePlayIcon();
      songTitleEl.textContent = 'Chưa có bài hát nào';
      updateVinylCover(null);
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '00:00';
      totalTimeEl.textContent = '00:00';
      renderPlaylist();
      return;
    }

    if (idx === currentIndex) {
      const nextIdx = idx < songs.length ? idx : 0;
      loadSong(nextIdx, isPlaying);
    } else {
      if (idx < currentIndex) currentIndex--;
      renderPlaylist();
    }
  }

  addMusicBtn.addEventListener('click', () => musicInput.click());
  document.getElementById('emptyState').addEventListener('click', () => musicInput.click());

  musicInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;

    const newEntries = [];
    for (const file of files) {
      const cleanName = file.name.replace(/\.[^/.]+$/, "");
      const url = URL.createObjectURL(file);

      const dur = await new Promise((resolve) => {
        const tempAudio = new Audio();
        tempAudio.src = url;
        tempAudio.addEventListener('loadedmetadata', () => resolve(formatTime(tempAudio.duration)));
        tempAudio.addEventListener('error', () => resolve('--:--'));
      });

      newEntries.push({
        title: cleanName,
        src: url,
        blob: file,
        duration: dur,
        cover: cover

  // --- LOGO UPLOAD ---

  // --- AUDIO & WEB AUDIO API VISUALIZER ---
  let audioCtx, analyser, dataArray, sourceNode;

  function initAudioContext() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.82;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  function playAudio() {
    if (songs.length === 0) {
      musicInput.click();
      return;
    }
    if (currentIndex === -1) {
      loadSong(0, true);
      return;
    }
    initAudioContext();
    audio.play().then(() => {
      isPlaying = true;
      vinylDisc.classList.add('playing');
      updatePlayIcon();
    }).catch(() => {});
  }

  function pauseAudio() {
    audio.pause();
    isPlaying = false;
    vinylDisc.classList.remove('playing');
    updatePlayIcon();
  }

  function updatePlayIcon() {
    playIcon.innerHTML = isPlaying
      ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
      : '<polygon points="6 4 20 12 6 20 6 4"/>';
  }

  playBtn.addEventListener('click', () => {
    isPlaying ? pauseAudio() : playAudio();

  prevBtn.addEventListener('click', () => {
    if (!songs.length) return;
    const prevIdx = (currentIndex - 1 + songs.length) % songs.length;
    loadSong(prevIdx, true);
  });

  function playNext(auto = false) {
    if (!songs.length) return;
    if (auto && repeatMode === 2) {
      audio.currentTime = 0;
      playAudio();
      return;
    }
    if (isShuffle && songs.length > 1) {
      let randIdx;
      do {
        randIdx = Math.floor(Math.random() * songs.length);
      } while (randIdx === currentIndex);
      loadSong(randIdx, true);
      return;
    }
    if (currentIndex + 1 < songs.length) {
      loadSong(currentIndex + 1, true);
    } else if (repeatMode === 1 || !auto) {
      loadSong(0, true);
    } else {
      pauseAudio();
    }
  }

  nextBtn.addEventListener('click', () => playNext(false));
  audio.addEventListener('ended', () => playNext(true));

  function updateModeLabel() {
    const parts = [];
    if (isShuffle) parts.push('Ngẫu nhiên');
    if (repeatMode === 1) parts.push('Lặp tất cả');
    else if (repeatMode === 2) parts.push('Lặp 1 bài');
    modeStatus.textContent = parts.length ? parts.join(' • ') : 'Tuần tự';

  shuffleBtn.addEventListener('click', () => {

    updateModeLabel();

  repeatBtn.addEventListener('click', () => {
    repeatMode = (repeatMode + 1) % 3;
    repeatBtn.classList.toggle('active', repeatMode > 0);
    repeatBtn.classList.toggle('repeat-one', repeatMode === 2);
    updateModeLabel();

  // --- PROGRESS & SCRUBBING ---
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = `${pct}%`;
    currentTimeEl.textContent = formatTime(audio.currentTime);
    totalTimeEl.textContent = formatTime(audio.duration);

  progressBar.addEventListener('click', (e) => {
    if (!audio.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    audio.currentTime = ratio * audio.duration;

  // --- THEME DOTS ---
  document.getElementById('colorDots').addEventListener('click', (e) => {

    if (!dot) return;
    document.querySelectorAll('.dot-btn').forEach(b => b.classList.remove('active'));
    dot.classList.add('active');
    waveTheme = dot.dataset.theme;

  // --- SHARE BUTTON ---
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const url = window.location.href;
    if (navigator.share) {
      try {
        await navigator.share({ title: '1chai65 - Chill Music Player', url });
        return;
      } catch (e) {}
    }
    try {
      await navigator.clipboard.writeText(url);
      showToast('Đã sao chép liên kết trang nhạc!');
    } catch (e) {
      showToast('Sẵn sàng chia sẻ trang nhạc 1chai65');
    }
  });

  // --- KEYBOARD & MEDIA SESSION ---
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') {
      e.preventDefault();
      isPlaying ? pauseAudio() : playAudio();
    } else if (e.code === 'ArrowRight') {
      playNext(false);
    } else if (e.code === 'ArrowLeft') {
      prevBtn.click();
    }
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', playAudio);
    navigator.mediaSession.setActionHandler('pause', pauseAudio);
    navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
    navigator.mediaSession.setActionHandler('nexttrack', () => playNext(false));
  }

  // --- SMOOTH 2-LAYER CIRCULAR WAVE ANIMATION ---
  const canvas = document.getElementById('waveCanvas');
  const ctx = canvas.getContext('2d');
  let phase = 0;

  function drawCircularWave() {
    requestAnimationFrame(drawCircularWave);
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    ctx.clearRect(0, 0, w, h);

    let bass = 0;
    const bins = 64;
    const values = new Array(bins).fill(0);

    if (isPlaying && analyser && dataArray) {
      analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < 10; i++) bass += dataArray[i];
      bass = (bass / 10) / 255;
      for (let i = 0; i < bins; i++) {
        values[i] = dataArray[i] / 255;
      }
    } else {
      bass = 0.04 + Math.sin(phase * 1.5) * 0.02;
      for (let i = 0; i < bins; i++) {
        values[i] = 0.05 + Math.sin(i * 0.35 + phase * 2) * 0.03;
      }
    }

    // Subtle bass pulse on vinyl
    const pulseScale = 1 + bass * 0.065;
    vinylDisc.style.scale = pulseScale.toFixed(3);

    phase += isPlaying ? 0.045 : 0.015;
    const baseRadius = 186 + bass * 10;

    // Color setup
    let strokeOuter, strokeInner, glowColor;
    if (waveTheme === 'cyan') {
      strokeOuter = '#00f0ff';
      strokeInner = 'rgba(0, 240, 255, 0.45)';
      glowColor = '#00f0ff';
    } else if (waveTheme === 'white') {
      strokeOuter = '#ffffff';
      strokeInner = 'rgba(255, 255, 255, 0.45)';
      glowColor = '#ffffff';
    } else if (waveTheme === 'rainbow') {
      const grad = ctx.createConicGradient(phase, cx, cy);
      grad.addColorStop(0, '#ff2a85');
      grad.addColorStop(0.25, '#ffbe0b');
      grad.addColorStop(0.5, '#00f5d4');
      grad.addColorStop(0.75, '#00bbf9');
      grad.addColorStop(1, '#ff2a85');
      strokeOuter = grad;
      strokeInner = grad;
      glowColor = '#ff2a85';
    } else {
      strokeOuter = '#ff2a85';
      strokeInner = 'rgba(255, 42, 133, 0.45)';
      glowColor = '#ff2a85';
    }

    function renderLoop(radiusOffset, ampScale, lineWidth, strokeStyle, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      const pts = [];
      for (let i = 0; i < bins; i++) {
        const angle = (i / bins) * Math.PI * 2 - Math.PI / 2;
        const mirrorIdx = i < bins / 2 ? i * 2 : (bins - i) * 2;
        const freqVal = values[Math.min(bins - 1, mirrorIdx)] || 0;
        const waveMod = Math.sin(i * 0.4 + phase * 3) * 3;
        const r = baseRadius + radiusOffset + freqVal * ampScale + waveMod;
        pts.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r
        });
      }

      for (let i = 0; i < pts.length; i++) {
        const p0 = pts[i];
        const p1 = pts[(i + 1) % pts.length];
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        if (i === 0) {
          const prev = pts[pts.length - 1];
          ctx.moveTo((prev.x + p0.x) / 2, (prev.y + p0.y) / 2);
        }
        ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
      }
      ctx.closePath();
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = strokeStyle;
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.restore();
    }

    renderLoop(6, 48, 3.2, strokeOuter, 0.95);
    renderLoop(-4, 30, 2.0, strokeInner, 0.65);
  }

  drawCircularWave();
  loadFromDB();
</script>
</body>
